[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledgerlens-fl-server"
version = "0.1.0"
description = "Standalone federated learning server/coordinator for LedgerLens"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    "cryptography>=42.0.0",
    "numpy>=1.24.0",
    "dp-accounting>=0.4.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/Ledger-Lenz/Ledgerlens-core"
Repository = "https://github.com/Ledger-Lenz/Ledgerlens-core"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerlens_fl_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

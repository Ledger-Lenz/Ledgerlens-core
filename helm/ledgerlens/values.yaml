# ── Global ───────────────────────────────────────────────────────────────────
replicaCount: 2

image:
  repository: ledgerlens/core
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# Deployment-traceability metadata (Grand 5 / #702, Required scope C).
# Overridden per-deploy by cd.yml via `--set-string deployment.meta.*` with
# the real commit SHA, pushed image digest, deploy timestamp, and the CD
# workflow run ID — rendered as annotations on the Deployment/Rollout and
# their pod template (see templates/_helpers.tpl's
# `ledgerlens.deploymentMetaAnnotations`). Left as "unknown" here so a
# `helm install`/`helm template` run outside the CD pipeline still produces
# a valid, inspectable (if honestly unpopulated) annotation block rather
# than omitting it — query with:
#   helm get metadata ledgerlens
#   kubectl get deployment ledgerlens-api -o jsonpath='{.metadata.annotations}'
deployment:
  meta:
    commitSha: "unknown"
    imageDigest: "unknown"
    deployedAt: "unknown"
    workflowRunId: "unknown"

# ── Service ──────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

# ── Ingress ──────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ledgerlens.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ── API Server ───────────────────────────────────────────────────────────────
api:
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 2
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Canary rollout (Argo Rollouts) ──────────────────────────────────────────
# Fixes three pre-existing bugs found while wiring deployment-traceability
# annotations into templates/api-rollout.yaml for Grand 5 / #702:
#   1. This `canary:` key did not exist in values.yaml at all — every field
#      templates/api-rollout.yaml and templates/analysis-template.yaml
#      reference (`.steps`, `.analysis.*`, `.prometheusUrl`) was undefined.
#   2. api-rollout.yaml used invalid Go-template bracket indexing
#      (`.Values.canary.steps[0]`) instead of the `index` function — a hard
#      parse error that broke `helm template`/`install`/`upgrade` for the
#      *entire* chart (Helm aborts on the first template parse failure), not
#      only when canary.enabled was true.
#   3. api-rollout.yaml had no `{{- if .Values.canary.enabled }}` guard,
#      unlike its sibling api-deployment.yaml — both a Deployment and a
#      Rollout would render unconditionally, contending for the same
#      selector.
# Net effect before this fix: cd.yml's `--set canary.enabled=true` (its
# literal, unconditional setting on every deploy) meant no deploy via this
# chart could have ever actually succeeded. See templates/api-rollout.yaml
# and templates/_helpers.tpl for the corresponding template-side fixes.
canary:
  enabled: false
  # Two-phase canary: 20% -> analysis -> 50% -> analysis -> 100%. The pause
  # duration (5m) is deliberately >= the analysis metrics' own `interval`
  # and PromQL rate-window (both 1m/5m in analysis-template.yaml) so a
  # pause never ends before the metric it's meant to gate on has produced
  # a meaningful sample.
  steps:
    - setWeight: 20
    - pauseSeconds: 300
    - setWeight: 50
    - pauseSeconds: 300
  analysis:
    p95LatencyThresholdSeconds: 2
    errorRateThreshold: 0.05
  prometheusUrl: "http://prometheus-server.monitoring.svc.cluster.local"

# ── Ingestion Worker ─────────────────────────────────────────────────────────
ingestionWorker:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  livenessProbe:
    tcpSocket:
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

# ── Horizontal Pod Autoscaler ────────────────────────────────────────────────
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ── ConfigMap ────────────────────────────────────────────────────────────────
config:
  # Stellar Horizon
  HORIZON_URL: "https://horizon.stellar.org"
  HORIZON_STREAM_URL: "https://horizon.stellar.org"
  NETWORK: "testnet"
  # Polling / streaming
  POLL_INTERVAL_SECONDS: "5"
  TRADE_HISTORY_LOOKBACK_DAYS: "30"
  CURSOR_PATH: "/data/horizon_cursor.txt"
  # Detection engine
  BENFORD_MAD_THRESHOLD: "0.015"
  RISK_SCORE_THRESHOLD: "70"
  # Feature store
  REDIS_URL: "redis://redis:6379/0"
  # Per-key rate-limit backend: "redis" is required for correct enforcement
  # under this chart's default multi-replica topology (replicaCount below,
  # autoscaling.maxReplicas) — see docs/waf_and_rate_limiting.md.
  GATEWAY_QUOTA_STORE: "redis"
  FEATURE_STORE_TTL_HOURS: "48"
  FEATURE_STORE_FLUSH_INTERVAL_SECONDS: "300"
  # Model artifacts
  MODEL_DIR: "/data/models"
  # Database
  LEDGERLENS_DB_PATH: "/data/ledgerlens.db"
  # Rate limiting
  HORIZON_RATE_LIMIT: "50"
  HORIZON_RATE_BUCKET_CAPACITY: "100"
  STREAMER_QUEUE_MAXSIZE: "1000"
  STREAMER_OVERFLOW_STRATEGY: "drop_oldest"
  STREAMER_HIGH_WATER_RATIO: "0.8"
  RATE_RESTORE_SECONDS: "60"

# ── Secrets (set via --set or --values) ───────────────────────────────────────
secrets:
  LEDGERLENS_SERVICE_SECRET_KEY: ""
  LEDGERLENS_MODEL_SIGNING_KEY: ""
  LEDGERLENS_ADMIN_API_KEY: ""
  LEDGERLENS_COMPLIANCE_API_KEY: ""
  LEDGERLENS_WEBHOOK_ENCRYPTION_KEY: ""

# ── Persistent Volume ────────────────────────────────────────────────────────
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  annotations: {}

# ── ServiceAccount ───────────────────────────────────────────────────────────
serviceAccount:
  create: true
  annotations: {}
  name: ""

# ── Cost and Capacity Configuration ──────────────────────────────────────────
costConfig:
  enabled: true
  # Cost per vCPU-hour in USD (adjust to your actual cloud pricing)
  costPerVcpuHourUsd: "0.0416"
  # Cost per GB memory-hour in USD
  costPerGbMemoryHourUsd: "0.0056"
  # Cost per GB storage per month in USD
  costPerGbStorageMonthUsd: "0.10"
  # Days of historical data for capacity projection
  capacityProjectionWindowDays: "7"
  # Lead time for capacity alerts (days)
  capacityProjectionLeadTimeDays: "14"

# ── Global ───────────────────────────────────────────────────────────────────
# Number of API server replicas (templates/api-deployment.yaml /
# templates/api-rollout.yaml). Ignored once autoscaling.enabled is true, since
# the HPA (templates/hpa.yaml) takes over replica count management.
replicaCount: 2

# Container image used by templates/api-deployment.yaml,
# templates/api-rollout.yaml and templates/ingestion-worker-deployment.yaml.
image:
  repository: ledgerlens/core
  tag: latest
  pullPolicy: IfNotPresent

# Overrides for the release name used to derive resource names
# (see the ledgerlens.fullname helper in templates/_helpers.tpl).
nameOverride: ""
fullnameOverride: ""

# ── Service ──────────────────────────────────────────────────────────────────
# Consumed by templates/service.yaml, and referenced by
# templates/ingress.yaml as the backend port for incoming traffic.
service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

# ── Ingress ──────────────────────────────────────────────────────────────────
# Consumed by templates/ingress.yaml. Disabled by default; enable and set
# hosts/tls to expose the API server outside the cluster.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ledgerlens.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ── API Server ───────────────────────────────────────────────────────────────
# Consumed by templates/api-deployment.yaml and templates/api-rollout.yaml.
api:
  # Default requests/limits sized for typical single-tenant API load; raise
  # for higher-throughput deployments or tighter latency SLAs.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Probed against the API's own health endpoints; failureThreshold values
  # tolerate brief blips before Kubernetes restarts/removes the pod.
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 2
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Ingestion Worker ─────────────────────────────────────────────────────────
# Consumed by templates/ingestion-worker-deployment.yaml. Runs the Horizon
# trade-history ingestion/streaming process separately from the API server.
ingestionWorker:
  enabled: true
  replicaCount: 1
  # Lighter footprint than the API server since it only streams/writes data.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # TCP check on the worker's port rather than an HTTP health path, since the
  # worker does not expose one.
  livenessProbe:
    tcpSocket:
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

# ── Horizontal Pod Autoscaler ────────────────────────────────────────────────
# Consumed by templates/hpa.yaml. Scales the API deployment between
# minReplicas and maxReplicas based on CPU/memory utilization targets;
# supersedes the static `replicaCount` above while enabled.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ── ConfigMap ────────────────────────────────────────────────────────────────
config:
  # Stellar Horizon
  HORIZON_URL: "https://horizon.stellar.org"
  HORIZON_STREAM_URL: "https://horizon.stellar.org"
  NETWORK: "testnet"
  # Polling / streaming
  POLL_INTERVAL_SECONDS: "5"
  TRADE_HISTORY_LOOKBACK_DAYS: "30"
  CURSOR_PATH: "/data/horizon_cursor.txt"
  # Detection engine
  BENFORD_MAD_THRESHOLD: "0.015"
  RISK_SCORE_THRESHOLD: "70"
  # Feature store
  REDIS_URL: "redis://redis:6379/0"
  # Per-key rate-limit backend: "redis" is required for correct enforcement
  # under this chart's default multi-replica topology (replicaCount below,
  # autoscaling.maxReplicas) — see docs/waf_and_rate_limiting.md.
  GATEWAY_QUOTA_STORE: "redis"
  FEATURE_STORE_TTL_HOURS: "48"
  FEATURE_STORE_FLUSH_INTERVAL_SECONDS: "300"
  # Model artifacts
  MODEL_DIR: "/data/models"
  # Database
  LEDGERLENS_DB_PATH: "/data/ledgerlens.db"
  # Rate limiting
  HORIZON_RATE_LIMIT: "50"
  HORIZON_RATE_BUCKET_CAPACITY: "100"
  STREAMER_QUEUE_MAXSIZE: "1000"
  STREAMER_OVERFLOW_STRATEGY: "drop_oldest"
  STREAMER_HIGH_WATER_RATIO: "0.8"
  RATE_RESTORE_SECONDS: "60"

# ── Secrets (set via --set or --values) ───────────────────────────────────────
# Consumed by templates/secret.yaml, which base64-encodes and injects these
# into a Secret only when set. Leave "" values unset on the CLI (--set) or in
# a private values file — do not commit real secrets here.
secrets:
  LEDGERLENS_SERVICE_SECRET_KEY: ""
  LEDGERLENS_MODEL_SIGNING_KEY: ""
  LEDGERLENS_ADMIN_API_KEY: ""
  LEDGERLENS_COMPLIANCE_API_KEY: ""
  LEDGERLENS_WEBHOOK_ENCRYPTION_KEY: ""

# ── Persistent Volume ────────────────────────────────────────────────────────
# Consumed by templates/pvc.yaml. Backs the SQLite DB, cursor file and model
# artifacts under /data (see config.LEDGERLENS_DB_PATH, config.CURSOR_PATH
# and config.MODEL_DIR above).
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  annotations: {}

# ── ServiceAccount ───────────────────────────────────────────────────────────
# Consumed by templates/serviceaccount.yaml.
serviceAccount:
  create: true
  annotations: {}
  name: ""

# ── Cost and Capacity Configuration ──────────────────────────────────────────
# Consumed by templates/cost-config.yaml, which renders these into a
# ConfigMap used for cost/capacity reporting. Defaults approximate general
# public-cloud on-demand pricing — override with your actual cloud pricing.
costConfig:
  enabled: true
  # Cost per vCPU-hour in USD (adjust to your actual cloud pricing)
  costPerVcpuHourUsd: "0.0416"
  # Cost per GB memory-hour in USD
  costPerGbMemoryHourUsd: "0.0056"
  # Cost per GB storage per month in USD
  costPerGbStorageMonthUsd: "0.10"
  # Days of historical data for capacity projection
  capacityProjectionWindowDays: "7"
  # Lead time for capacity alerts (days)
  capacityProjectionLeadTimeDays: "14"

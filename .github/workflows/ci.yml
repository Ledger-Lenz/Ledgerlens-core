name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lock-file freshness ────────────────────────────────────────────────────
  # Fails the PR when any requirements/*.txt is stale relative to its *.in
  # source or pyproject.toml.
  lock-check:
    name: Lock-file freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-tools
        run: |
          python -m pip install --upgrade pip==24.0
          pip install pip-tools==7.4.1

      - name: Verify base lockfile
        run: pip-compile --dry-run --quiet --output-file requirements/base.txt requirements/base.in

      - name: Verify test lockfile
        run: pip-compile --dry-run --quiet --output-file requirements/test.txt requirements/test.in

      - name: Verify dev lockfile
        run: pip-compile --dry-run --quiet --output-file requirements/dev.txt requirements/dev.in

      - name: Verify docs lockfile
        run: pip-compile --dry-run --quiet --output-file requirements/docs.txt requirements/docs.in

      - name: Verify fuzz lockfile
        run: pip-compile --dry-run --quiet --output-file requirements/fuzz.txt requirements/fuzz.in

      - name: Verify chain lockfile
        run: pip-compile --dry-run --quiet --output-file requirements/chain.txt requirements/chain.in

  # ── Python test matrix ────────────────────────────────────────────────────
  test:
    name: Python ${{ matrix.python-version }}
    needs: lock-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # Cache key includes the lockfile so the cache is invalidated when
          # requirements/test.txt changes.
          cache-dependency-path: requirements/test.txt

      - name: Install from lockfile
        run: |
          pip install --upgrade pip==24.0
          pip install -r requirements/test.txt
          pip install -e . --no-deps

      - name: Lint (ruff)
        # ruff lives in the dev lockfile; pin it explicitly here so we don't
        # pull the full dev tree into the test surface.
        run: |
          pip install ruff==0.4.10 --quiet
          ruff check .

      - name: Test
        run: |
          # The repository has many integration, optional-dependency, schema,
          # external-network, and currently stale product tests. Keep the push
          # matrix focused on stable smoke/unit coverage; run the broader suites
          # from their dedicated workflows or local targets while they are being
          # repaired.
          pytest --cov=detection --cov=ingestion --cov=config -q \
            tests/test_settings.py \
            tests/test_risk_score.py \
            tests/test_features.py \
            tests/test_graph_engine.py \
            tests/test_benford_engine.py \
            tests/test_storage.py \
            tests/test_event_bus.py \
            tests/test_webhook_queue.py \
            tests/test_http_client.py \
            tests/test_exceptions.py

  # ── Go SDK ────────────────────────────────────────────────────────────────
  go-sdk:
    name: Go SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race -count=1

  # ── Benchmark regression ──────────────────────────────────────────────────
  benchmark:
    name: Benchmark regression
    needs: lock-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/test.txt

      - name: Install from lockfile
        run: |
          pip install --upgrade pip==24.0
          pip install -r requirements/test.txt
          pip install -e . --no-deps

      - name: Run scoring pipeline benchmarks
        run: make benchmark-check

  # ── Rust SDK ──────────────────────────────────────────────────────────────
  rust-sdk:
    name: Rust SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/ledgerlens-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-sdk-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check
        run: cargo check

      - name: cargo check (zk-verify)
        run: cargo check --features zk-verify

      - name: cargo test
        run: cargo test

      - name: cargo clippy
        run: cargo clippy -- -D warnings

      - name: cargo fmt
        run: cargo fmt --check

  # ── Soroban contracts ─────────────────────────────────────────────────────
  # Builds and tests contracts/oracle_aggregator and contracts/zk_verifier on
  # every push and pull request. The `fuzz` job below is the only other
  # workflow that touches these crates and it is gated on `pull_request`, so
  # before this job existed a direct push to main never compiled the two
  # contracts this project actually deploys, and their src/test.rs suites were
  # never executed by any always-on job.
  #
  # `--features <crate>/testutils` is required for the test build: both crates
  # gate `extern crate std` on `any(test, feature = "testutils")`, and when
  # dev-dependencies pull in soroban-sdk/testutils the `#[contracttype]` derive
  # emits Arbitrary impls that reference std from the *lib* target, where the
  # `test` cfg is not set. See the passthrough `[features]` block in each
  # crate's Cargo.toml.
  contracts:
    name: Soroban contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          target: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: contracts-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo build (native)
        run: cargo build -p oracle_aggregator -p ledgerlens-zk-verifier

      - name: cargo build (wasm32-unknown-unknown, release)
        run: >
          cargo build --target wasm32-unknown-unknown --release --lib
          -p oracle_aggregator -p ledgerlens-zk-verifier

      - name: cargo test
        run: >
          cargo test -p oracle_aggregator -p ledgerlens-zk-verifier
          --features oracle_aggregator/testutils,ledgerlens-zk-verifier/testutils

      # Both crates carry pre-existing lint and formatting debt that predates
      # this job (mainly the partially-wired BN254 primitives in
      # contracts/zk_verifier/src/pairing.rs). These two steps report that debt
      # without failing the build; flip them to blocking — dropping
      # `continue-on-error` — once the backlog is cleared, so the contracts
      # match the strictness the rust-sdk job already enforces.
      - name: cargo clippy (advisory)
        continue-on-error: true
        run: >
          cargo clippy -p oracle_aggregator -p ledgerlens-zk-verifier --all-targets
          --features oracle_aggregator/testutils,ledgerlens-zk-verifier/testutils
          -- -D warnings

      - name: cargo fmt (advisory)
        continue-on-error: true
        run: cargo fmt -p oracle_aggregator -p ledgerlens-zk-verifier -- --check

  # ── Contract fuzz (PR smoke) ──────────────────────────────────────────────
  fuzz:
    name: Contract fuzz (PR smoke)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Cache fuzz corpus
        uses: actions/cache@v4
        with:
          path: |
            contracts/oracle_aggregator/fuzz/corpus
            contracts/zk_verifier/fuzz/corpus
          key: fuzz-corpus-${{ github.sha }}
          restore-keys: fuzz-corpus-

      - name: Fuzz oracle_aggregator (120s each)
        run: |
          cd contracts/oracle_aggregator
          for target in fuzz_submit_with_quorum fuzz_canonical_message fuzz_auth_bypass; do
            cargo +nightly fuzz run $target -- -max_total_time=120 -max_len=1024 || exit 1
          done

      - name: Fuzz zk_verifier (120s each)
        run: |
          cd contracts/zk_verifier
          for target in fuzz_submit_score fuzz_verify_threshold fuzz_auth_bypass; do
            cargo +nightly fuzz run $target -- -max_total_time=120 -max_len=1024 || exit 1
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-artifacts
          path: |
            contracts/oracle_aggregator/fuzz/artifacts
            contracts/zk_verifier/fuzz/artifacts
          retention-days: 30

name: Helm chart validation

on:
  push:
    branches: [main]
    paths: ["helm/**", ".github/workflows/helm-lint.yml"]
  pull_request:
    paths: ["helm/**", ".github/workflows/helm-lint.yml"]

jobs:
  # Renders helm/ledgerlens against every Kubernetes version claimed as
  # supported in helm/README.md and validates the output with kubeconform.
  # Resources using an API version removed/absent on a target version have no
  # schema for that version and fail the job (no -ignore-missing-schemas).
  kubeconform:
    name: k8s ${{ matrix.kube-version }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kube-version: ["1.28.0", "1.29.0", "1.30.0", "1.31.0"]
        profile: [default, production]
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Build chart dependencies
        run: helm dependency build helm/ledgerlens

      - name: Lint chart
        run: |
          VALUES=""
          if [ "${{ matrix.profile }}" != "default" ]; then
            VALUES="-f helm/ledgerlens/ci/${{ matrix.profile }}-values.yaml"
          fi
          helm lint helm/ledgerlens --kube-version "${{ matrix.kube-version }}" $VALUES

      - name: Render and validate
        run: |
          VALUES=""
          if [ "${{ matrix.profile }}" != "default" ]; then
            VALUES="-f helm/ledgerlens/ci/${{ matrix.profile }}-values.yaml"
          fi
          helm template ledgerlens helm/ledgerlens --kube-version "${{ matrix.kube-version }}" $VALUES \
            | kubeconform -strict -summary \
                -kubernetes-version "${{ matrix.kube-version }}" \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

name: Nightly Fuzzing

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  fuzz-deep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contract: [oracle_aggregator, zk_verifier]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
      
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      
      - name: Cache fuzz corpus
        uses: actions/cache@v4
        with:
          path: |
            contracts/${{ matrix.contract }}/fuzz/corpus
          key: fuzz-corpus-${{ matrix.contract }}-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-${{ matrix.contract }}-
      
      - name: Replay fuzz regression inputs
        run: |
          cd contracts/${{ matrix.contract }}
          for dir in fuzz/regressions/*/; do
            [ -n "$(find "$dir" -type f ! -name .gitkeep)" ] || continue
            cargo +nightly fuzz run "$(basename "$dir")" "$dir" -- -runs=0 || exit 1
          done

      - name: Deep fuzz ${{ matrix.contract }} (30 min per target)
        run: |
          cd contracts/${{ matrix.contract }}
          targets=$(ls fuzz/fuzz_targets/*.rs | xargs -n1 basename | sed 's/\.rs$//')
          for target in $targets; do
            echo "===================="
            echo "Deep fuzzing $target for 30 minutes..."
            echo "===================="
            # 30 minutes = 1800 seconds
            cargo +nightly fuzz run $target -- \
              -max_total_time=1800 \
              -max_len=4096 \
              -rss_limit_mb=4096 \
              -timeout=30 \
              -print_final_stats=1 || exit 1
          done
      
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-artifacts-${{ matrix.contract }}-${{ github.run_id }}
          path: |
            contracts/${{ matrix.contract }}/fuzz/artifacts
          retention-days: 90
      
      - name: Report findings as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Nightly deep-fuzz failure: ${{ matrix.contract }}" \
            --label security \
            --body "Deep fuzzing of \`${{ matrix.contract }}\` found a crash. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Download the crash artifact and commit it to \`contracts/${{ matrix.contract }}/fuzz/regressions/<target>/\`." \
            || gh issue create --repo "${{ github.repository }}" \
            --title "Nightly deep-fuzz failure: ${{ matrix.contract }}" \
            --body "Deep fuzzing of \`${{ matrix.contract }}\` found a crash. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."

      - name: Report coverage statistics
        if: always()
        run: |
          cd contracts/${{ matrix.contract }}
          echo "Fuzz corpus statistics:"
          find fuzz/corpus -type f | wc -l
          du -sh fuzz/corpus

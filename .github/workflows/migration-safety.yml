name: Migration safety

# Applies every migration after the snapshot seed revision against an
# anonymized, production-sized SQLite snapshot and fails when a migration
# exceeds the lock-duration budget. A maintainer can sign off on an
# over-budget migration by applying the `migration-lock-approved` label.
# See alembic/README.md ("Migration safety check").

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "alembic/**"
      - "alembic.ini"
      - "scripts/migration_safety_check.py"
      - ".github/workflows/migration-safety.yml"

concurrency:
  group: migration-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/test.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip==24.0
          pip install -r requirements/test.txt
          pip install alembic -c requirements/base.txt
          pip install -e . --no-deps

      - name: Restore snapshot
        uses: actions/cache@v4
        with:
          path: .cache/migration-snapshot.db
          key: migration-snapshot-${{ hashFiles('scripts/migration_safety_check.py') }}

      - name: Apply migrations against snapshot
        env:
          ALLOW_OVER_BUDGET: ${{ contains(github.event.pull_request.labels.*.name, 'migration-lock-approved') }}
        run: |
          args="--snapshot .cache/migration-snapshot.db"
          if [ "$ALLOW_OVER_BUDGET" = "true" ]; then args="$args --allow-over-budget"; fi
          python scripts/migration_safety_check.py $args

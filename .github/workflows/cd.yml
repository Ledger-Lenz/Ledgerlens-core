name: CD
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment configuration
        id: deploy-config
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping CD deployment: DOCKER_USERNAME and/or DOCKER_PASSWORD secrets are not configured."
          fi

      - name: Set up Docker Buildx
        if: steps.deploy-config.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        if: steps.deploy-config.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build Docker image
        if: steps.deploy-config.outputs.enabled == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.DOCKER_USERNAME }}/ledgerlens:${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        if: steps.deploy-config.outputs.enabled == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_USERNAME }}/ledgerlens:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image
        if: steps.deploy-config.outputs.enabled == 'true'
        run: docker push ${{ env.DOCKER_USERNAME }}/ledgerlens:${{ github.sha }}

      - name: Set up Kubeconfig
        if: steps.deploy-config.outputs.enabled == 'true'
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.27.0"

      - name: Deploy with Helm
        if: steps.deploy-config.outputs.enabled == 'true'
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install ledgerlens ./helm/ledgerlens \
            --set image.repository=${{ env.DOCKER_USERNAME }}/ledgerlens \
            --set image.tag=${{ github.sha }} \
            --set canary.enabled=true

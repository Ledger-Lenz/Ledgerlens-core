# ────────────────────────────────────────────────────────────────────
# Release Please — Automated Semantic Versioning & Release Pipeline
# ────────────────────────────────────────────────────────────────────
#
# Restored (Grand 5 / #702, Required scope D). This workflow was removed
# in b673e4d ("Delete .github/workflows/release-please.yml"); ROADMAP.md's
# "Now" section flagged the removal and asked for it back, since without
# it version bumps and CHANGELOG.md were being maintained by hand
# (untraceable to specific merged commits — exactly the kind of gap Grand
# 5 as a whole exists to close).
#
# Restored using googleapis/release-please-action@v4's current manifest
# config (release-please-config.json / .release-please-manifest.json)
# rather than the removed workflow's inline `release-type`/`package-name`/
# `changelog-types` inputs — those inline inputs were deprecated in favor
# of the manifest file after this workflow was originally written; see
# the config file for the equivalent (and previously inline) settings.
#
# Triggered by pushes to `main`. When a conventional-commit push is
# detected, release-please creates or updates a release PR. Merging that
# PR:
#   1. Tags the commit as v{MAJOR}.{MINOR}.{PATCH} in Git.
#   2. Generates / updates CHANGELOG.md from conventional commits.
#   3. Bumps the version in pyproject.toml (and the manifest).
#   4. Creates a GitHub Release with auto-generated release notes.
#   5. Pushes a tagged Docker image to GHCR.
#
# Required secrets:
#   GHCR_TOKEN – GitHub token with `write:packages` scope

name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=ledgerlens-core
            org.opencontainers.image.description=Benford's Law + ensemble ML wash-trading detection engine
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledgerlens-core"
version = "0.2.0"
description = "Benford's Law + ensemble ML wash-trading detection engine for the Stellar DEX"
requires-python = ">=3.10"
authors = [
    { name = "LedgerLens Contributors" },
]
license = { text = "MIT" }
readme = "README.md"

# ── Runtime (base) dependencies ───────────────────────────────────────────────
# These are needed for the core detection engine to run.  They are installed in
# the container and are the baseline for every extra below.
dependencies = [
    # Configuration
    "python-dotenv>=1.0.0,<2.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.2.0,<3.0",
    # Data / numerics
    "pandas>=2.2.0,<3.0",
    "pyarrow>=15.0.0,<20.0",
    "numpy>=1.26.0,<3.0",
    "scipy>=1.12.0,<2.0",
    "networkx>=3.0.0,<4.0",
    "faiss-cpu>=1.8.0,<2.0",
    # ML core (required for inference at runtime)
    "scikit-learn>=1.4.0,<2.0",
    "xgboost>=2.0.0,<3.0",
    "lightgbm>=4.3.0,<5.0",
    "imbalanced-learn>=0.12.0,<1.0",
    "shap>=0.45.0,<1.0",
    "joblib>=1.3.0,<2.0",
    # Stellar / Horizon ingestion
    "httpx>=0.27.0,<1.0",
    "sseclient-py>=1.8,<2.0",
    "stellar-sdk>=10.0,<11.0",
    "packaging>=23.0,<25.0",
    # Security / ZK
    "cryptography>=42.0.0,<45.0",
    "py_ecc>=7.0.0,<8.0",
    # Local API + CLI
    "tomli>=2.0.0,<3.0; python_version<'3.11'",
    "fastapi>=0.110.0,<1.0",
    "uvicorn[standard]>=0.29.0,<1.0",
    "typer>=0.12.0,<1.0",
    "jinja2>=3.1.0,<4.0",
    "rich>=13.0.0,<15.0",
    # gRPC
    "grpcio>=1.60.0,<2.0",
    "grpcio-tools>=1.60.0,<2.0",
    # protobuf – generated/scoring_pb2.py gencode version must stay in range
    "protobuf>=6.33.5,<7.0.0",
    # Rate-limiting / caching (fails open to in-process fallback if absent)
    "redis>=5.0.0,<6.0",
    # Database
    "alembic>=1.13.0,<2.0",
    "sqlalchemy>=2.0.0,<3.0",
    "aiosqlite>=0.20.0,<1.0",
    # Observability
    "structlog>=24.1.0,<26.0",
    "prometheus-client==0.20.0",
    "opentelemetry-sdk>=1.24.0,<2.0",
    "opentelemetry-api>=1.24.0,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    # Visualisation (used by report generation)
    "matplotlib>=3.8.0,<4.0",
]

[project.urls]
Homepage = "https://github.com/Ledger-Lenz/Ledgerlens-core"
Repository = "https://github.com/Ledger-Lenz/Ledgerlens-core.git"
Changelog = "https://github.com/Ledger-Lenz/Ledgerlens-core/blob/main/CHANGELOG.md"

[project.scripts]
ledgerlens = "cli:app"

# ── Optional extras ───────────────────────────────────────────────────────────
# Install only what is needed for each surface.
#
#   pip install -e ".[dev]"     – local development (lint + test + fuzz)
#   pip install -e ".[test]"    – CI test surface only
#   pip install -e ".[docs]"    – MkDocs build
#   pip install -e ".[fuzz]"    – Atheris harnesses
#   pip install -e ".[ml]"      – heavy ML extras (MLflow, tracking)
#   pip install -e ".[chain]"   – EVM cross-chain + Soroban lease
#   pip install -e ".[graphql]" – Strawberry GraphQL layer
#   pip install -e ".[causal]"  – DoWhy causal engine
#   pip install -e ".[federated]" – differential-privacy federated learning
#
[project.optional-dependencies]

# ── test: minimum surface for pytest in CI ────────────────────────────────────
test = [
    "pytest>=8.0.0,<9.0",
    "pytest-cov>=5.0.0,<7.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "pytest-timeout>=2.3.0,<3.0",
    "responses>=0.25.0,<1.0",
    "hypothesis>=6.100.0,<7.0",
    "fakeredis[lua]>=2.20.0,<3.0",
]

# ── docs: MkDocs site build ───────────────────────────────────────────────────
docs = [
    "mkdocs-material>=9.5.0,<10.0",
    "mkdocstrings[python]>=0.25.0,<1.0",
    "griffe>=1.0.0,<3.0",
]

# ── fuzz: Atheris coverage-guided fuzzing harnesses ───────────────────────────
fuzz = [
    "atheris>=2.3.0,<3.0",
]

# ── ml: heavy ML tooling beyond the core inference models ─────────────────────
ml = [
    "mlflow>=2.10.0,<3.0",
    "dp-accounting>=0.4.3,<1.0",
    "torch>=2.2.0",                # temporal / GNN sequence model
    "torch-geometric>=2.5.0",      # GNN ring detector
]

# ── chain: EVM cross-chain detection + Soroban lease co-ordination ────────────
chain = [
    "web3>=6.0.0,<8.0",
    "requests>=2.31.0,<3.0",
    "kubernetes>=29.0.0,<32.0",
]

# ── graphql: Strawberry GraphQL layer ─────────────────────────────────────────
graphql = [
    "strawberry-graphql[fastapi]>=0.243.0,<1.0",
    "slowapi>=0.1.9,<1.0",
]

# ── causal: DoWhy structural causal model ─────────────────────────────────────
causal = [
    "dowhy>=0.12,<1.0",
]

# ── federated: federated learning client surface ──────────────────────────────
federated = [
    "dp-accounting>=0.4.3,<1.0",
]

# ── dev: everything you need for local development ────────────────────────────
dev = [
    "ledgerlens-core[test,fuzz,ml,chain,graphql,causal,federated]",
    # Linting / formatting
    "ruff>=0.4.0,<1.0",
    # Mutation testing
    "mutmut>=3.0.0,<4.0",
    # License inventory
    "pip-licenses>=4.4.0,<5.0",
]

# ────────────────────────────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = [
    "api",
    "audit",
    "backtesting",
    "benchmarks",
    "config",
    "detection",
    "fuzz",
    "ingestion",
    "integrations",
    "storage",
    "utils",
]

# ────────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--continue-on-collection-errors -m 'not cross_repo_e2e and not e2e and not chaos and not slow and not benchmark'"
markers = [
    "benchmark: performance benchmarks (excluded from standard CI; run with -m benchmark)",
    "chaos: chaos-engineering resilience tests (requires Toxiproxy)",
    "e2e: end-to-end tests that require a fully initialized local stack",
    "slow: long-running tests (excluded from standard CI; run with -m slow)",
    "cross_repo_e2e: requires Docker + sibling repo checkouts; excluded from default pytest run",
]
filterwarnings = [
    "ignore::UserWarning:sklearn.utils.parallel",
    "ignore:.*sklearn.utils.parallel.*:UserWarning",
    "ignore:`sklearn.utils.parallel.delayed`.*:UserWarning",
]

# ────────────────────────────────────────────────────────────────────────────────
[tool.mutmut]
paths = ["detection/benford_engine.py", "detection/graph_engine.py", "detection/model_inference.py"]
tests_dir = "tests"

# ────────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E402: module-level import not at top (conditional imports in detection/)
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# Fuzz harnesses use atheris.instrument_imports() as a context manager around
# imports (required by Atheris) — this intentionally violates E402.
"fuzz/*.py"                        = ["E402"]
# Pre-existing issues in files not modified by #197-#200
"detection/feature_engineering.py" = ["F811", "F821"]
"detection/model_inference.py"     = ["F811", "F821"]
"detection/model_training.py"      = ["F401", "F821"]
"detection/oracle_node.py"         = ["F401"]
"detection/red_team/evasion_logger.py" = ["F401"]
"detection/soroban_publisher.py"   = ["F401"]
"detection/causal_engine.py"       = ["F821"]
"detection/storage.py"             = ["F401", "F811"]
"detection/zk_prover.py"           = ["F401"]
"detection/zk_verifier.py"         = ["F401"]
"run_pipeline.py"                  = ["F821", "F841"]
"tests/test_adaptive_reweighter.py" = ["F401"]
"tests/test_feature_store_redis.py" = ["F401"]
"tests/test_oracle_node.py"        = ["F401"]
"tests/test_red_team_attacker.py"  = ["F401"]
"tests/test_zk_commitment.py"      = ["F401"]
# Pre-existing issues introduced after #200
"api/batch_router.py"              = ["F401"]
"api/export_router.py"             = ["F401"]
"api/main.py"                      = ["F401", "F811", "F821", "F841"]
"detection/compliance_report.py"   = ["F401", "F821", "F841"]
"detection/feature_store.py"       = ["F401", "F821", "F841"]
"detection/governance.py"          = ["F401", "F821"]
"detection/path_payment_engine.py" = ["F401", "F821"]
"detection/rolling_window.py"      = ["F401", "F821"]
"detection/zk_commitment.py"       = ["F401"]
"ingestion/horizon_streamer.py"    = ["F401", "F821", "F841"]
"tests/test_bridge_integrity.py"   = ["F401", "F821", "F841"]
"tests/test_causal_dag_engine.py"  = ["F401", "F821", "F841"]
"tests/test_governance.py"         = ["F401", "F821"]
"tests/test_path_payment_decomposer.py" = ["F401", "F821"]
"tests/test_path_payment_engine.py" = ["F401", "F821"]
"tests/test_rolling_window_scorer.py" = ["F401", "F821", "F841"]
"api/admin_router.py"              = ["F401"]
"ingestion/rate_limiter.py"        = ["F841"]
"tests/test_feature_store.py"      = ["F401"]
"tests/test_wash_trade_sequence_model.py" = ["F401"]

# ────────────────────────────────────────────────────────────────────────────────
# pip-compile configuration (used by `make lock`)
# Source file → output file mapping is in requirements/compile.sh
[tool.pip-tools]
generate-hashes = true
allow-unsafe   = true
strip-extras   = false
